<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Desktop Pet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: transparent;
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
        }
        #pet-container {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        #live2d-canvas {
            position: absolute; top: 0; left: 0;
            -webkit-app-region: no-drag;
        }
        #static-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: auto;
            transform-origin: top center;
            display: none;
            -webkit-app-region: no-drag;
        }
        #placeholder {
            max-width: 80%; max-height: 80%;
            object-fit: contain;
            display: none;
        }
        .controls {
            position: absolute; bottom: 5px; right: 5px;
            display: flex; gap: 3px;
            -webkit-app-region: no-drag;
            opacity: 0; transition: opacity 0.3s;
            z-index: 100;
        }
        #pet-container:hover .controls { opacity: 1; }
        .ctrl-btn {
            width: 24px; height: 24px;
            border: none; border-radius: 50%;
            background: rgba(255,255,255,0.8);
            cursor: pointer; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,1); }
        .ctrl-btn:disabled { opacity: 0.3; cursor: default; }
    </style>
</head>
<body>
    <div id="pet-container">
        <canvas id="live2d-canvas"></canvas>
        <img id="static-image" alt="pet">
        <img id="placeholder" alt="placeholder">
        <!-- 对话气泡并入舞台:同一覆盖窗口承载头部与气泡 -->
        <div id="stage-bubble" style="display:none; position:absolute; bottom:20%; left:50%; transform:translateX(-50%); -webkit-app-region:no-drag; z-index:50;">
            <div id="stage-bubble-text" style="background:rgba(255,255,255,0.92); color:#555; padding:10px 14px; border-radius:14px; font-size:14px; max-width:320px; word-break:break-word;"></div>
        </div>
        <div class="controls">
            <button class="ctrl-btn" id="btn-smaller" title="Smaller">−</button>
            <button class="ctrl-btn" id="btn-bigger" title="Bigger">+</button>
            <button class="ctrl-btn" id="btn-settings" title="Settings">⚙</button>
            <button class="ctrl-btn" id="btn-close" title="Close">✕</button>
        </div>
    </div>

    <script src="libs/live2dcubismcore.min.js"></script>
    <script src="libs/pixi.min.js"></script>
    <script src="libs/cubism4.min.js"></script>
    <script>
        // 渲染日志转发到主进程:经 petBridge 的窄接口,免开 --enable-logging
        if (window.petBridge?.rendererLog) {
            for (const level of ['log', 'warn', 'error']) {
                const orig = console[level];
                console[level] = (...args) => {
                    orig.apply(console, args);
                    try { window.petBridge.rendererLog(level, args.map(String)); } catch {}
                };
            }
        }
    </script>
    <!-- 舞台组合根:加载 stage-boot 模块,把 petBridge 适配成 stage 所需窄接口 -->
    <script type="module">
        import { bootStage } from './src/renderer/boot/stage-boot.js';

        //// 把分域的 petBridge 拍平成 stage-boot 期待的窄接口 [@busybee 2026-06-13] ////
        // stage-boot 调用 loadConfig、validateModelPaths、getCursorPosition 等扁平方法;
        // 此处从分域桥按域取出对应能力,组成 stage-boot 的 narrowApi,渲染侧不直接抓全局。
        function makeNarrowApi(bridge) {
            const ui = bridge.ui || {};
            const config = bridge.config || {};
            const file = bridge.file || {};
            const events = bridge.events || {};
            return {
                loadConfig: config.loadConfig,
                validateModelPaths: file.validateModelPaths,
                getCursorPosition: ui.getCursorPosition,
                getWindowBounds: ui.getWindowBounds,
                setWindowSize: ui.setWindowSize,
                setWindowPosition: ui.setWindowPosition,
                showSettings: (bridge.system || {}).showSettings,
                closePetWindow: ui.closePetWindow,
                onPlayExpression: events.onPlayExpression,
                onRevertExpression: events.onRevertExpression,
                onPlayMotion: events.onPlayMotion,
                onTalkingStateChanged: events.onTalkingStateChanged,
                onModelConfigUpdate: events.onModelConfigUpdate,
                onSizeChanged: events.onSizeChanged
            };
        }

        //// 临时渲染适配:在渲染端 PIXI 与 Cubism 接好前,先用空适配占位 [@busybee 2026-06-13] ////
        // 真正的 Live2DAdapter 需在浏览器侧创建 PIXI 与 Cubism 后注入,见报告所列接口缺口。
        async function createRenderAdapter() {
            return {
                playAction() {}, revertAction() {}, setTalking() {}, setTrack() {}, dispose() {}
            };
        }

        const narrowApi = makeNarrowApi(window.petBridge || {});
        const session = await bootStage(narrowApi, { createRenderAdapter });

        // 把气泡推送并入舞台:订阅聊天消息,写进舞台内气泡而非独立窗口
        const bubble = document.getElementById('stage-bubble');
        const bubbleText = document.getElementById('stage-bubble-text');
        const showBubble = (msg, autoCloseTime) => {
            bubbleText.textContent = msg;
            bubble.style.display = 'block';
            setTimeout(() => { bubble.style.display = 'none'; }, autoCloseTime || 8000);
        };
        if (window.petBridge?.events?.onChatBubbleMessage) {
            window.petBridge.events.onChatBubbleMessage((data) => showBubble(data.message, data.autoCloseTime));
        }
        if (window.petBridge?.events?.onShowChatMessage) {
            window.petBridge.events.onShowChatMessage((data) => showBubble(data.message, data.autoCloseTime));
        }

        // 控件:加减尺寸、设置、关闭经 stage-boot 暴露的控件下达
        document.getElementById('btn-smaller').addEventListener('click', () => session.controls.shrink());
        document.getElementById('btn-bigger').addEventListener('click', () => session.controls.grow());
        document.getElementById('btn-settings').addEventListener('click', () => session.controls.openSettings());
        document.getElementById('btn-close').addEventListener('click', () => session.controls.close());

        console.log('[DesktopPet] stage 已装配');
    </script>
</body>
</html>
